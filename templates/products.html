{% extends 'layout.html' %}

{% block content %}

<h2>Product Master</h2>

<form method="POST" action="/add_product">

<div class="row">

<div class="col-md-2">
<input class="form-control"
name="product_code"
placeholder="Code">
</div>

<div class="col-md-3">
<input class="form-control"
name="product_name"
placeholder="Product Name">
</div>

<div class="col-md-2">
<input class="form-control"
name="category"
placeholder="Category">
</div>

<div class="col-md-2">
<input class="form-control"
name="purchase_price"
placeholder="Purchase">
</div>

<div class="col-md-2">
<input class="form-control"
name="sale_price"
placeholder="Sale">
</div>

</div>

<br>

<button class="btn btn-success">
Save Product
</button>

</form>

{% endblock %}
