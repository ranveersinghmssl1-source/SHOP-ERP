{% extends 'layout.html' %}

{% block content %}

<h2>Dashboard</h2>

<div class="row">

    <div class="col-md-4">
        <div class="card bg-primary text-white">
            <div class="card-body">
                <h3>{{ product_count }}</h3>
                <p>Total Products</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-success text-white">
            <div class="card-body">
                <h3>{{ customer_count }}</h3>
                <p>Total Customers</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-warning text-dark">
            <div class="card-body">
                <h3>{{ supplier_count }}</h3>
                <p>Total Suppliers</p>
            </div>
        </div>
    </div>

</div>

<hr>

<a href="/products" class="btn btn-primary">
    Products
</a>

<a href="/customers" class="btn btn-success">
    Customers
</a>

<a href="/suppliers" class="btn btn-warning">
    Suppliers
</a>

{% endblock %}
